<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Декодер раскладки</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
      }
      .box {
        background: white;
        border: 1px solid #ccc;
        padding: 20px;
        max-width: 500px;
      }
      textarea {
        width: 100%;
        height: 80px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>Декодер раскладки</h1>
    <div class="box">
      <p>Вводи текст, набранный в неверной раскладке (например: <b>B ult 'njn</b>)</p>
      <textarea id="input" placeholder="Вставь сюда зашифрованный текст"></textarea>
      <button onclick="decode()">Расшифровать</button>
      <div id="result"></div>
    </div>

    <script>
      // Вот здесь находится расшифровка — менять нужно только этот блок
      const map = {
         "B" : "А",
   "." : "Б",
   "D" : "В",
   "," : "Г",
   "F" : "Д",
   "!" : "Е",
   "H" : "Ж",
   "?" : "З",
   "J" : "И",
   "*" : "К",
   "L" : "Л",
   ":" : "М",
   "N" : "Н",
   "@" : "О",
   "P" : "П",
   "%" : "Р",
   "R" : "С",
   "-" : "Т",
   "T" : "У",
   "_" : "Ф",
   "V" : "Х",
   "=" : "Ц",
   "W" : "Ч",
   "+" : "Ш",
   "U" : "Щ",
   "(" : "Ы",
   "Z" : "Ь",
   ")" : "Э",
   "|" : "Ю",
   "/" : "Я"
      };

      function decode() {
        const text = document.getElementById('input').value;
        let output = '';
        for (const ch of text) {
          output += (map[ch] !== undefined) ? map[ch] : ch;
        }
        document.getElementById('result').textContent = output;
      }
    </script>
  </body>
</html>
