<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Декодер PDU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: monospace;
      background: #000;
      color: #00ff00;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .panels {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .panel {
      background: #111;
      border: 2px solid #333;
      padding: 20px;
      width: 400px;
      border-radius: 8px;
    }
    .panel h2 {
      color: #00ff00;
      margin-bottom: 12px;
      font-size: 18px;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 12px;
      background: #000;
      color: #00ff00;
      border: 1px solid #333;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      border-radius: 4px;
      resize: none;
    }
    textarea:focus { outline: none; border-color: #00ff00; }
    button {
      padding: 10px 20px;
      background: #111;
      color: #00ff00;
      border: 1px solid #00ff00;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    button:hover {
      background: #00ff00;
      color: #000;
    }
    .result-box {
      margin-top: 12px;
      padding: 10px;
      border: 1px dashed #444;
      min-height: 50px;
      white-space: pre-wrap;
      word-break: break-all;
      border-radius: 4px;
      background: #050505;
    }
  </style>
</head>
<body>
  <h1>Декодер PDU</h1>
  <div class="panels">
    <div class="panel">
      <h2>Расшифровать</h2>
      <textarea id="decodeInput" placeholder="Вставь зашифрованный текст"></textarea>
      <button onclick="doDecode()">Расшифровать</button>
      <div class="result-box" id="decodeResult"></div>
    </div>
    <div class="panel">
      <h2>Зашифровать</h2>
      <textarea id="encodeInput" placeholder="Вставь обычный текст"></textarea>
      <button onclick="doEncode()">Зашифровать</button>
      <div class="result-box" id="encodeResult"></div>
    </div>
  </div>

  <script>
    // ВПИСЫВАЙ СВОЙ ШИФР ЗДЕСЬ: слева зашифрованное, справа расшифрованное
    const map = {
   "B" : "А",
   "." : "Б",
   "D" : "В",
   "," : "Г",
   "F" : "Д",
   "!" : "Е",
   "H" : "Ж",
   "?" : "З",
   "J" : "И",
   "*" : "К",
   "L" : "Л",
   ":" : "М",
   "N" : "Н",
   "@" : "О",
   "P" : "П",
   "%" : "Р",
   "R" : "С",
   "-" : "Т",
   "T" : "У",
   "_" : "Ф",
   "V" : "Х",
   "=" : "Ц",
   "W" : "Ч",
   "+" : "Ш",
   "U" : "Щ",
   "(" : "Ы",
   "Z" : "Ь",
   ")" : "Э",
   "|" : "Ю",
   "/" : "Я"
    };

    const reverseMap = {};
    for (const key in map) {
      reverseMap[map[key]] = key;
    }

    function doDecode() {
      const text = document.getElementById('decodeInput').value;
      let output = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        output += (map[ch] !== undefined) ? map[ch] : ch;
      }
      document.getElementById('decodeResult').textContent = output;
    }

    function doEncode() {
      const text = document.getElementById('encodeInput').value;
      let output = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        output += (reverseMap[ch] !== undefined) ? reverseMap[ch] : ch;
      }
      document.getElementById('encodeResult').textContent = output;
    }
  </script>
</body>
</html>
