
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Декодер</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #0f0f12;
        color: #c0c0c0;
      }
      .box {
        background: #1a1a22;
        border: 2px solid #444;
        padding: 20px;
        max-width: 600px;
      }
      textarea {
        width: 100%;
        height: 80px;
        margin-bottom: 10px;
        box-sizing: border-box;
        background: #000;
        color: #0f0;
        border: 1px solid #333;
        font-family: monospace;
      }
      .buttons {
        display: flex;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        background: #222;
        color: white;
        border: 1px solid #555;
        cursor: pointer;
        font-family: monospace;
      }
      button:hover { background: #444; }
      #result {
        margin-top: 15px;
        padding: 10px;
        border: 1px dashed #555;
        white-space: pre-wrap;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Декодер</h1>
    <div class="box">
      <textarea id="input" placeholder="Вставь текст сюда"></textarea>
      <div class="buttons">
        <button onclick="decode()">Расшифровать</button>
        <button onclick="encode()">Зашифровать</button>
      </div>
      <div id="result"></div>
    </div>

    <script>
      // ТУТ ВПИСЫВАЙ СВОЙ ШИФР
      // Слева — зашифрованный символ, справа — расшифрованный
      const map = {
         "B" : "А",
   "." : "Б",
   "D" : "В",
   "," : "Г",
   "F" : "Д",
   "!" : "Е",
   "H" : "Ж",
   "?" : "З",
   "J" : "И",
   "*" : "К",
   "L" : "Л",
   ":" : "М",
   "N" : "Н",
   "@" : "О",
   "P" : "П",
   "%" : "Р",
   "R" : "С",
   "-" : "Т",
   "T" : "У",
   "_" : "Ф",
   "V" : "Х",
   "=" : "Ц",
   "W" : "Ч",
   "+" : "Ш",
   "U" : "Щ",
   "(" : "Ы",
   "Z" : "Ь",
   ")" : "Э",
   "|" : "Ю",
   "/" : "Я"
      };

      // Обратная карта (для зашифровки)
      const reverseMap = {};
      for (const key in map) {
        reverseMap[map[key]] = key;
      }

      function decode() {
        const text = document.getElementById('input').value;
        let output = '';
        for (const ch of text) {
          output += (map[ch] !== undefined) ? map[ch] : ch;
        }
        document.getElementById('result').textContent = output;
      }

      function encode() {
        const text = document.getElementById('input').value;
        let output = '';
        for (const ch of text) {
          output += (reverseMap[ch] !== undefined) ? reverseMap[ch] : ch;
        }
        document.getElementById('result').textContent = output;
      }
    </script>
  </body>
</html>
